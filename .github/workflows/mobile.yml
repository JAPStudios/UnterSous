name: Mobile app checks

on:
  push:
    paths:
      - "App.tsx"
      - "app.json"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "App.tsx"
      - "app.json"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/mobile.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npx expo config --type public
